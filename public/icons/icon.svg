<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f293d"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background App Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="6"/>

  <!-- Glowing Backdrop Circle -->
  <circle cx="256" cy="256" r="150" fill="#10b981" opacity="0.18" filter="url(#glow)"/>

  <!-- Receipt Base Card -->
  <g transform="translate(136, 100)">
    <!-- Receipt Shadow -->
    <rect x="0" y="0" width="240" height="312" rx="20" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
    
    <!-- Receipt Header Strip -->
    <rect x="24" y="32" width="100" height="18" rx="6" fill="#38bdf8"/>
    <rect x="180" y="32" width="36" height="18" rx="6" fill="#34d399"/>

    <!-- Receipt Dashed Line -->
    <line x1="24" y1="72" x2="216" y2="72" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-dasharray="8,6"/>

    <!-- Receipt Line Items -->
    <rect x="24" y="96" width="110" height="12" rx="4" fill="rgba(255,255,255,0.5)"/>
    <rect x="160" y="96" width="56" height="12" rx="4" fill="#f3f4f6"/>

    <rect x="24" y="126" width="90" height="12" rx="4" fill="rgba(255,255,255,0.5)"/>
    <rect x="160" y="126" width="56" height="12" rx="4" fill="#f3f4f6"/>

    <rect x="24" y="156" width="120" height="12" rx="4" fill="rgba(255,255,255,0.5)"/>
    <rect x="160" y="156" width="56" height="12" rx="4" fill="#f3f4f6"/>

    <!-- Total Row -->
    <rect x="24" y="196" width="192" height="42" rx="10" fill="rgba(16, 185, 129, 0.16)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="2"/>
    <text x="40" y="223" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold">SPLIT</text>
    <text x="160" y="224" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900">₹/AI</text>

    <!-- Bottom Jagged Receipt Edge Cutouts -->
    <path d="M 20 286 L 40 304 L 60 286 L 80 304 L 100 286 L 120 304 L 140 286 L 160 304 L 180 286 L 200 304 L 220 286" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- AI Sparkle / Star (Top Right) -->
  <g transform="translate(340, 90)" filter="url(#glow)">
    <path d="M 30 0 Q 30 30 0 30 Q 30 30 30 60 Q 30 30 60 30 Q 30 30 30 0 Z" fill="url(#sparkleGrad)"/>
    <circle cx="30" cy="30" r="6" fill="#ffffff"/>
  </g>
  
  <!-- Mini Sparkle (Bottom Left) -->
  <g transform="translate(100, 340)">
    <path d="M 16 0 Q 16 16 0 16 Q 16 16 16 32 Q 16 16 32 16 Q 16 16 16 0 Z" fill="#38bdf8" opacity="0.8"/>
  </g>
</svg>
